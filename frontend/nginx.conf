server {
    listen 80;
    server_name localhost;

    absolute_redirect off; 

    location /momo-store/ {
        alias /usr/share/nginx/html/momo-store/;
        try_files $uri $uri/ /momo-store/index.html;
    }

    location = / {
        return 302 /momo-store/;
    }

    error_page 404 /momo-store/index.html;
}