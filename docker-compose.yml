version: '3.8'

services:
  backend:
    build: ./backend
    image: momo-store-backend
    profiles:
      - dev
      - prod
    expose:
      - "8081"
    environment:
      - USELESS_SECRET_FILE=/run/secrets/useless-secret
    restart: unless-stopped
    networks:
      - backend-network
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64M
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    secrets:
      - useless-secret
  frontend:
    build:
      context: ./frontend
      target: prod
    image: momo-store-backend
    profiles:
      - prod
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - frontend-network
    read_only: true
    tmpfs:
      - /var/cache/nginx:noexec,nosuid,size=128M
      - /var/run:noexec,nosuid,size=5M
      - /tmp:noexec,nosuid,size=64M
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/momo-store/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 128M

  nginx-proxy:
    image: nginx:1.29.8-alpine
    profiles:
      - prod
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - frontend-network
      - backend-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    read_only: true
    tmpfs:
      - /var/cache/nginx:noexec,nosuid,size=128M
      - /var/run:noexec,nosuid,size=5M
      - /tmp:noexec,nosuid,size=64M
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge

volumes:
  nginx-logs:
    driver: local

secrets:
  useless-secret:
    file: ./useless-secret.txt