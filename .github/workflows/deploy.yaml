name: Main workflow

on:
  push:
    branches:
      - main

jobs:
  build_and_push_to_docker_hub:
      name: Push Docker image to DockerHub
      runs-on: ubuntu-latest
      steps:
        - name: Check out the repo
          uses: actions/checkout@v3
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v2
        - name: Login to Docker 
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKER_USER }}
            password: ${{ secrets.DOCKER_PASSWORD }}
        - name: Push Backend to DockerHub
          uses: docker/build-push-action@v4
          with:
            context: ./backend/
            push: true
            tags: ${{ secrets.DOCKER_USER }}/docker-project-backend:latest
        - name: Push Frontend to DockerHub
          uses: docker/build-push-action@v4
          with:
            context: ./frontend/
            push: true
            tags: ${{ secrets.DOCKER_USER }}/docker-project-frontend:latest

  run-with-docker-compose:
    name: Push Docker image to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build via Docker Compose
        uses: hoverkraft-tech/compose-action@v2.2.0

  # сканирование полученных образов
  vulnerability-scan:
    name: Scan ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: run-with-docker-compose  
    strategy:
      fail-fast: false
      matrix:
        image:
          - nginxinc/nginx-unprivileged:1.29.8-alpine   
          - backend                                       
          - frontend
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Resolve full image name for custom images
        id: resolve
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USER }}
        run: |
          # Подставновка имени пользователя из секрета для созданных образов
          if [[ "${{ matrix.image }}" == "backend" ]]; then
            FULL_IMAGE="$DOCKER_USERNAME/docker-project-backend:latest"
          elif [[ "${{ matrix.image }}" == "frontend" ]]; then
            FULL_IMAGE="$DOCKER_USERNAME/docker-project-frontend:latest"
          else
            FULL_IMAGE="${{ matrix.image }}"
          fi
          echo "full_image=$FULL_IMAGE" >> $GITHUB_OUTPUT

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.resolve.outputs.full_image }}
          format: 'table'
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL'