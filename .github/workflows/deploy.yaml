name: Main workflow

on:
  push:
    branches:
      - main

jobs:
  build_and_push_to_docker_hub:
      name: Push Docker image to DockerHub
      runs-on: ubuntu-latest
      steps:
        - name: Check out the repo
          uses: actions/checkout@v3
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v2
        - name: Login to Docker 
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKER_USER }}
            password: ${{ secrets.DOCKER_PASSWORD }}
        - name: Push Backend to DockerHub
          uses: docker/build-push-action@v4
          with:
            context: ./backend/
            push: true
            tags: ${{ secrets.DOCKER_USER }}/docker-project-backend:latest
        - name: Push Frontend to DockerHub
          uses: docker/build-push-action@v4
          with:
            context: ./frontend/
            push: true
            tags: ${{ secrets.DOCKER_USER }}/docker-project-frontend:latest

  run-with-docker-compose:
    name: Push Docker image to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build via Docker Compose
        uses: hoverkraft-tech/compose-action@v2.2.0
        with:
          services-log-level: "debug" 

  # сборка всех исользуемых образов
  generate-image-list:
    name: Generate list of images
    runs-on: ubuntu-latest
    needs: run-with-docker-compose
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Create compose file and extract images
        id: list
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USER }}
        run: |
          IMAGES=$(docker compose -f docker-compose.yml config | \
                  yq e '.services[].image' - | sort -u | jq -R -s -c 'split("\n")[:-1]')
          echo "images=$IMAGES" >> $GITHUB_OUTPUT

  # сканирование полученных образов
  vulnerability-scan:
    name: Scan ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: generate-image-list
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.generate-image-list.outputs.images) }}
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Scan ${{ matrix.image }} with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image }}
          format: 'table'
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL'